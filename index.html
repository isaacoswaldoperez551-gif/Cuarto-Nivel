<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jefe Final · La Gran Paradoja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070f;
    --panel:#0b1422;
    --panel-2:#13233a;
    --line:#274764;
    --text:#e9f6ff;
    --muted:#8fb3c9;
    --cyan:#4ce0d2;
    --violet:#b78cff;
    --amber:#f2b705;
    --danger:#ff4d6d;
    --ok:#59e6a3;
    --accent:var(--cyan);
    --ui:'VT323', ui-monospace, monospace;
    --pixel:'Press Start 2P', var(--ui);
  }
  :root:not([data-theme="light"]){ color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--ui);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  canvas#stage{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  .scanlines{position:fixed; inset:0; pointer-events:none; z-index:40; opacity:.35; mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0px, rgba(0,0,0,.14) 1px, transparent 2px, transparent 4px);}
  .vignette{position:fixed; inset:0; pointer-events:none; z-index:39;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.72) 100%);}
  #flash{position:fixed; inset:0; pointer-events:none; z-index:45; opacity:0; background:#fff; transition:opacity .28s ease-out;}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; left:0; right:0; top:0; z-index:20; pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
    display:flex; gap:10px 16px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(4,7,15,.92) 55%, transparent);
  }
  .hud[hidden]{display:none;}
  .hud-block{display:flex; align-items:center; gap:8px; font-size:17px; color:var(--muted); line-height:1;}
  .tag{font-family:var(--pixel); font-size:8px; letter-spacing:1px; color:var(--accent);}
  .bar{width:104px; height:11px; border:2px solid var(--line); background:#0008; position:relative;}
  .bar i{position:absolute; inset:0; background:linear-gradient(90deg,var(--accent),#1e90ff); transform-origin:left; transition:transform .25s linear;}
  .bar.low i{background:linear-gradient(90deg,var(--danger),var(--amber));}
  .pips{display:flex; gap:5px;}
  .pips b{width:11px; height:11px; border:2px solid var(--line); background:#0006; display:block;}
  .pips b.on{background:var(--ok); border-color:var(--ok); box-shadow:0 0 7px var(--ok);}
  .pips b.bad{background:var(--danger); border-color:var(--danger); box-shadow:0 0 7px var(--danger);}
  .ghost-btn{
    pointer-events:auto; font-family:var(--ui); font-size:16px; background:transparent; color:var(--muted);
    border:2px solid var(--line); padding:5px 11px; cursor:pointer;
  }
  .ghost-btn:hover,.ghost-btn:focus-visible{border-color:var(--accent); color:var(--accent); outline:none;}

  /* ---------- Bottom console ---------- */
  .console{
    position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg, rgba(4,7,15,.95) 55%, transparent);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .console[hidden]{display:none;}
  .readout{
    pointer-events:none; width:100%; max-width:640px; border:2px solid var(--line); background:rgba(11,20,34,.9);
    padding:9px 13px; font-size:19px; min-height:42px; color:var(--text); text-align:center;
  }
  .readout b{color:var(--accent);}
  .readout.err b{color:var(--danger);}
  .options{
    pointer-events:auto; width:100%; max-width:720px; display:grid; gap:10px;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); max-height:38vh; overflow-y:auto;
  }
  .option{
    font-family:var(--ui); font-size:19px; line-height:1.15; color:var(--text); text-align:left;
    background:rgba(19,35,58,.92); border:2px solid var(--line); padding:12px 13px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .option:hover,.option:focus-visible{border-color:var(--accent); transform:translateY(-2px); outline:none;}
  .option.correct{border-color:var(--ok); box-shadow:0 0 16px #59e6a355;}
  .option.wrong{border-color:var(--danger); box-shadow:0 0 16px #ff4d6d55;}
  .console-row{pointer-events:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  /* ---------- Overlays ---------- */
  .veil{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));
    background:rgba(3,5,11,.86); backdrop-filter:blur(2px); overflow-y:auto;
  }
  .veil.show{display:flex;}
  .card{
    width:100%; max-width:560px; border:3px solid var(--accent); background:linear-gradient(165deg, var(--panel), #060a13);
    padding:26px 22px; box-shadow:0 0 44px rgba(76,224,210,.18);
  }
  .card.win{border-color:var(--ok); box-shadow:0 0 44px #59e6a340;}
  .card.lose{border-color:var(--danger); box-shadow:0 0 44px #ff4d6d40;}
  .card h2{font-family:var(--pixel); font-size:15px; line-height:1.7; color:var(--accent); margin:0 0 14px;}
  .card.win h2{color:var(--ok);} .card.lose h2{color:var(--danger);}
  .card p{font-size:20px; line-height:1.35; color:var(--muted); margin:0 0 14px;}
  .card p strong{color:var(--text); font-weight:400;}
  .btn{
    font-family:var(--ui); font-size:20px; background:var(--panel-2); color:var(--text);
    border:2px solid var(--line); padding:11px 20px; cursor:pointer;
  }
  .btn:hover,.btn:focus-visible{border-color:var(--accent); color:var(--accent); outline:none;}
  .btn.primary{border-color:var(--accent); color:var(--accent);}
  .btn.primary:hover{background:var(--accent); color:#04121a;}
  .card-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}

  /* ---------- Hub ---------- */
  #hub .card{max-width:700px; border-color:var(--amber); box-shadow:0 0 50px rgba(242,183,5,.14); background:linear-gradient(165deg,#120e08,#05070d);}
  #hub h1{font-family:var(--pixel); font-size:23px; line-height:1.6; color:var(--amber); margin:0 0 6px; text-shadow:0 0 18px rgba(242,183,5,.35);}
  #hub .lede{font-size:21px; color:var(--muted); margin:0 0 20px; max-width:56ch;}
  .levels{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); margin-bottom:16px;}
  .lvl{
    text-align:left; font-family:var(--ui); font-size:19px; color:var(--text); cursor:pointer;
    background:rgba(19,35,58,.6); border:2px solid var(--line); padding:12px 13px; display:block; width:100%;
    transition:border-color .12s ease, transform .12s ease;
  }
  .lvl:hover:not(:disabled),.lvl:focus-visible:not(:disabled){border-color:var(--amber); transform:translateY(-2px); outline:none;}
  .lvl .n{font-family:var(--pixel); font-size:8px; color:var(--amber); display:block; margin-bottom:7px;}
  .lvl .d{color:var(--muted); font-size:17px; display:block; margin-top:3px;}
  .lvl:disabled{opacity:.45; cursor:not-allowed;}
  .lvl.done{border-color:var(--ok);} .lvl.done .n{color:var(--ok);}
  .relics{display:flex; gap:9px; align-items:center; flex-wrap:wrap; font-size:17px; color:var(--muted);}
  .relic{width:15px; height:15px; border:2px solid var(--line); transform:rotate(45deg);}
  .relic.got{background:var(--ok); border-color:var(--ok); box-shadow:0 0 9px var(--ok);}

  .qr-code{background:#fff; padding:12px; display:inline-block; margin:0 0 12px;}
  .qr-code canvas,.qr-code img{display:block;}
  .valid-code{font-family:var(--pixel); font-size:12px; color:var(--amber); background:#000; border:2px dashed var(--amber);
    padding:10px; margin-bottom:14px; letter-spacing:2px; word-break:break-all; text-align:center;}
  .score-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .score-row input{flex:1 1 180px; font-family:var(--ui); font-size:19px; background:#000; color:var(--text); border:2px solid var(--line); padding:8px 10px;}
  .score-row input:focus-visible{border-color:var(--accent); outline:none;}
  .board{border:2px solid var(--line); padding:10px 14px; margin-bottom:14px; max-height:150px; overflow-y:auto;}
  .board h3{font-family:var(--pixel); font-size:9px; color:var(--accent); margin:0 0 8px;}
  .board ol{margin:0; padding-left:20px; font-size:18px; color:var(--text);}

  #boot{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:var(--bg);}
  #boot span{font-family:var(--pixel); font-size:11px; color:var(--cyan); animation:pulse 1.1s steps(2,end) infinite;}
  @keyframes pulse{50%{opacity:.25;}}

  @media (max-width:520px){
    #hub h1{font-size:17px;} .card h2{font-size:12px;}
    .readout{font-size:18px;} .option{font-size:18px;}
    .hud{font-size:15px; padding-top:calc(8px + env(safe-area-inset-top,0px));}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="flash"></div>

<header class="hud" id="hud">
  <div class="hud-block"><span class="tag" id="hudTag">CÁMARA</span><span id="hudTitle">—</span></div>
  <div class="hud-block" id="hudMetricWrap"><span id="hudMetricLbl">Estabilidad</span><div class="bar" id="hudBar"><i id="hudBarFill"></i></div></div>
  <div class="hud-block" id="hudMetric2Wrap" hidden><span id="hudMetric2Lbl">Energía</span><div class="bar" id="hudBar2"><i id="hudBar2Fill"></i></div></div>
  <div class="hud-block"><span id="hudLivesLbl">Errores</span><div class="pips" id="hudLives"></div></div>
  <div class="hud-block"><button class="ghost-btn" id="reloadBtn">Reiniciar</button></div>
</header>

<section class="console" id="console">
  <div class="options" id="options" hidden></div>
  <div class="readout" id="readout">—</div>
  <div class="console-row" id="consoleRow"></div>
</section>
<!-- Result -->
<div class="veil" id="result">
  <div class="card win" id="resultCard">
    <h2 id="resultTitle">—</h2>
    <p id="resultText">—</p>
    <div class="card-actions" id="resultActions"></div>
  </div>
</div>
<div id="boot"><span>Cargando el reactor…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const easeOut = t => 1-Math.pow(1-t,3);
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

const ui = {
  hud:$('#hud'), hudTag:$('#hudTag'), hudTitle:$('#hudTitle'), hudMetricLbl:$('#hudMetricLbl'),
  hudBar:$('#hudBar'), hudBarFill:$('#hudBarFill'), hudLives:$('#hudLives'), hudLivesLbl:$('#hudLivesLbl'),
  hudMetricWrap:$('#hudMetricWrap'),
  hudMetric2Wrap:$('#hudMetric2Wrap'), hudMetric2Lbl:$('#hudMetric2Lbl'), hudBar2:$('#hudBar2'), hudBar2Fill:$('#hudBar2Fill'),
  console:$('#console'), options:$('#options'), readout:$('#readout'), consoleRow:$('#consoleRow'),
  result:$('#result'), resultCard:$('#resultCard'), resultTitle:$('#resultTitle'), resultText:$('#resultText'),
  resultActions:$('#resultActions'), flash:$('#flash')
};

function say(html, isErr){
  ui.readout.innerHTML = html;
  ui.readout.classList.toggle('err', !!isErr);
}
function flash(color, strength){
  ui.flash.style.background = color || '#ffffff';
  ui.flash.style.opacity = strength==null ? .55 : strength;
  setTimeout(()=>{ ui.flash.style.opacity = 0; }, 60);
}
function setAccent(hex){ document.documentElement.style.setProperty('--accent', hex); }
function setLives(used, max){
  ui.hudLives.innerHTML = '';
  for(let i=0;i<max;i++){
    const b = document.createElement('b');
    if(i < used) b.className = 'bad';
    ui.hudLives.appendChild(b);
  }
}
function setPips(done, total){
  ui.hudLives.innerHTML = '';
  for(let i=0;i<total;i++){
    const b = document.createElement('b');
    if(i < done) b.className = 'on';
    ui.hudLives.appendChild(b);
  }
}

/* =======================================================================
   1. Motor: renderer, cámara orbital suave, tweens, partículas
   ======================================================================= */
const canvas = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setSize(window.innerWidth, window.innerHeight);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, .1, 300);
const clock = new THREE.Clock();

const rig = {
  target:new THREE.Vector3(), goalTarget:new THREE.Vector3(),
  radius:11, goalRadius:11,
  theta:0, goalTheta:0, phi:1.22, goalPhi:1.22,
  minPhi:.55, maxPhi:1.72, thetaRange:.75, baseTheta:0,
  shake:0
};
function frameCamera(o){
  rig.goalTarget.set(o.tx||0, o.ty||0, o.tz||0);
  if(o.snap){ rig.target.copy(rig.goalTarget); rig.radius = o.radius; rig.theta = o.theta||0; rig.phi = o.phi||1.22; }
  rig.goalRadius = o.radius; rig.baseTheta = o.theta||0; rig.goalTheta = o.theta||0; rig.goalPhi = o.phi||1.22;
  if(o.thetaRange!=null) rig.thetaRange = o.thetaRange;
}
function updateRig(dt){
  const k = 1-Math.pow(.0015, dt);
  rig.target.lerp(rig.goalTarget, k);
  rig.radius = lerp(rig.radius, rig.goalRadius, k);
  rig.theta = lerp(rig.theta, rig.goalTheta, k);
  rig.phi = lerp(rig.phi, rig.goalPhi, k);
  const sp = Math.sin(rig.phi);
  camera.position.set(
    rig.target.x + rig.radius*sp*Math.sin(rig.theta),
    rig.target.y + rig.radius*Math.cos(rig.phi),
    rig.target.z + rig.radius*sp*Math.cos(rig.theta)
  );
  if(rig.shake > 0){
    const s = rig.shake;
    camera.position.x += (Math.random()-.5)*s;
    camera.position.y += (Math.random()-.5)*s;
    rig.shake = Math.max(0, rig.shake - dt*1.6);
  }
  camera.lookAt(rig.target);
}

/* --- tweens --- */
let tweens = [];
function tween(o){ o.t = 0; tweens.push(o); return o; }
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw = tweens[i];
    tw.t += dt;
    const p = clamp(tw.t/tw.dur, 0, 1);
    tw.step(tw.ease ? tw.ease(p) : p, p);
    if(p >= 1){ tweens.splice(i,1); if(tw.done) tw.done(); }
  }
}

/* --- timers de escena --- */
let timeouts = [];
function later(fn, ms){ const id = setTimeout(fn, ms); timeouts.push(id); return id; }
function clearLater(){ timeouts.forEach(clearTimeout); timeouts = []; }

/* --- texturas procedurales --- */
function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(.28,'rgba(255,255,255,.45)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();
function glowSprite(color, size, opacity){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW, color:new THREE.Color(color), blending:THREE.AdditiveBlending,
    depthWrite:false, transparent:true, opacity:opacity==null?.75:opacity
  }));
  s.scale.setScalar(size);
  return s;
}
function letterTexture(txt, color){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.clearRect(0,0,256,256);
  g.font = '700 108px "Press Start 2P", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 26;
  g.fillStyle = color; g.fillText(txt, 128, 136);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function letterSprite(txt, color, size){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:letterTexture(txt,color), transparent:true, depthTest:false, depthWrite:false
  }));
  s.scale.setScalar(size); s.renderOrder = 20;
  return s;
}
function wrapText(g, text, maxW){
  const words = String(text).split(/\s+/); const lines = []; let line = '';
  words.forEach(w=>{
    const t = line ? line+' '+w : w;
    if(g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  });
  if(line) lines.push(line);
  return lines;
}
function textSprite(text, color, widthUnits){
  const W = 512, H = 128;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.font = '64px "VT323", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = '#000'; g.shadowBlur = 10;
  g.fillStyle = color; g.fillText(text, W/2, H/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false, depthWrite:false }));
  s.scale.set(widthUnits, widthUnits*H/W, 1);
  s.renderOrder = 18;
  return s;
}
function holoTexture(label, body, accent, bg){
  const W = 1024, H = 420;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = bg || '#0b0619'; g.fillRect(0,0,W,H);
  g.globalAlpha = .14; g.fillStyle = accent; g.fillRect(0,0,W,H); g.globalAlpha = 1;
  g.strokeStyle = accent; g.lineWidth = 8; g.strokeRect(14,14,W-28,H-28);
  g.globalAlpha = .12; g.strokeStyle = accent; g.lineWidth = 2;
  for(let y=0;y<H;y+=8){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.globalAlpha = 1;
  g.font = '26px "Press Start 2P", monospace'; g.fillStyle = 'rgba(167,149,207,.9)';
  g.textAlign = 'center'; g.fillText(label, W/2, 82);
  g.font = '62px "VT323", monospace'; g.fillStyle = '#efe7ff';
  g.shadowColor = accent; g.shadowBlur = 18;
  const lines = wrapText(g, body, W-140);
  const start = H/2 - ((lines.length-1)*66)/2 + 18;
  lines.forEach((ln,i)=> g.fillText(ln, W/2, start + i*66));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

/* --- partículas --- */
function makeBurst(scene, color, count){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    color:new THREE.Color(color), size:.16, map:GLOW, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, opacity:0
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.userData = { vel:new Float32Array(count*3), life:0, count };
  scene.add(pts);
  return pts;
}
function fireBurst(pts, origin, power){
  const d = pts.geometry.attributes.position.array, v = pts.userData.vel, n = pts.userData.count;
  for(let i=0;i<n;i++){
    d[i*3] = origin.x; d[i*3+1] = origin.y; d[i*3+2] = origin.z;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), sp = (.4+Math.random())*power;
    v[i*3] = Math.sin(ph)*Math.cos(th)*sp; v[i*3+1] = Math.sin(ph)*Math.sin(th)*sp; v[i*3+2] = Math.cos(ph)*sp;
  }
  pts.userData.life = 1;
  pts.material.opacity = 1;
  pts.geometry.attributes.position.needsUpdate = true;
}
function updateBurst(pts, dt){
  if(pts.userData.life <= 0) return;
  const d = pts.geometry.attributes.position.array, v = pts.userData.vel, n = pts.userData.count;
  for(let i=0;i<n;i++){
    d[i*3] += v[i*3]*dt; d[i*3+1] += v[i*3+1]*dt - .5*dt*dt*4; d[i*3+2] += v[i*3+2]*dt;
    v[i*3+1] -= 2.2*dt;
  }
  pts.userData.life -= dt*.75;
  pts.material.opacity = Math.max(0, pts.userData.life);
  pts.geometry.attributes.position.needsUpdate = true;
}

/* --- etiquetas 3D que siempre miran a cámara --- */
let labels = [];
function attachLabel(scene, obj, txt, color, size, radius){
  const s = letterSprite(txt, color, size);
  scene.add(s);
  const rec = { sprite:s, obj, radius };
  labels.push(rec);
  return rec;
}
function dropLabels(pred){
  labels = labels.filter(L=>{
    if(!pred(L)) return true;
    if(L.sprite.parent) L.sprite.parent.remove(L.sprite);
    if(L.sprite.material.map) L.sprite.material.map.dispose();
    L.sprite.material.dispose();
    return false;
  });
}
const _wp = new THREE.Vector3(), _dir = new THREE.Vector3();
function updateLabels(){
  for(let i=labels.length-1;i>=0;i--){
    const L = labels[i];
    if(!L.obj.parent){ L.sprite.visible = false; continue; }
    L.obj.getWorldPosition(_wp);
    _dir.copy(camera.position).sub(_wp).normalize().multiplyScalar(L.radius);
    L.sprite.position.copy(_wp).add(_dir);
    L.sprite.visible = L.obj.visible;
  }
}

/* --- control de escena activa --- */
let current = null;   // { scene, update(dt), click(hitList), dispose() }
function setScene(next){
  if(current && current.dispose) current.dispose();
  clearLater(); tweens = []; labels = [];
  current = next;
}

/* --- entrada: arrastrar para orbitar, tocar para interactuar --- */
const pointer = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
let down = null, dragged = false;
canvas.addEventListener('pointerdown', e=>{
  down = { x:e.clientX, y:e.clientY, theta:rig.goalTheta, phi:rig.goalPhi };
  dragged = false;
  canvas.setPointerCapture(e.pointerId);
});
let lastHover = 0;
canvas.addEventListener('pointermove', e=>{
  if(!down) return;
  const dx = e.clientX-down.x, dy = e.clientY-down.y;
  if(!dragged && Math.hypot(dx,dy) > 7) dragged = true;
  if(dragged){
    rig.goalTheta = clamp(down.theta - dx*.005, rig.baseTheta-rig.thetaRange, rig.baseTheta+rig.thetaRange);
    rig.goalPhi = clamp(down.phi - dy*.004, rig.minPhi, rig.maxPhi);
  }
});
canvas.addEventListener('pointermove', e=>{
  if(down || !current || !current.hitTargets) return;
  const now = performance.now();
  if(now - lastHover < 90) return;
  lastHover = now;
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX-r.left)/r.width)*2-1;
  pointer.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  canvas.style.cursor = raycaster.intersectObjects(current.hitTargets()).length ? 'pointer' : 'grab';
});
canvas.addEventListener('pointerup', e=>{
  if(down && !dragged && current && current.click){
    const r = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX-r.left)/r.width)*2-1;
    pointer.y = -((e.clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(pointer, camera);
    current.click(raycaster);
  }
  down = null;
});
canvas.addEventListener('pointercancel', ()=>{ down = null; });

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- bucle --- */
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  if(current && current.update) current.update(dt);
  updateTweens(dt);
  updateRig(dt);
  updateLabels();
  if(current) renderer.render(current.scene, camera);
}

   2. Piezas de escenografía reutilizables
   ======================================================================= */
function starField(scene, count, spread, color){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]   = (Math.random()-.5)*spread;
    pos[i*3+1] = (Math.random()-.5)*spread*.6;
    pos[i*3+2] = (Math.random()-.5)*spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    color:new THREE.Color(color||0xffffff), size:.42, map:GLOW,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:.85
  }));
  scene.add(pts);
  return pts;
}
function neonRing(radius, tube, color, opacity){
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 10, 80),
    new THREE.MeshBasicMaterial({ color:new THREE.Color(color), transparent:true, opacity:opacity==null?.7:opacity, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  return m;
}
function gridFloor(scene, y, color, dim){
  const grid = new THREE.GridHelper(120, 60, new THREE.Color(color), new THREE.Color(dim));
  grid.material.transparent = true; grid.material.opacity = .28; grid.position.y = y;
  scene.add(grid);
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({ color:0x04080f, roughness:.85, metalness:.2 })
  );
  plane.rotation.x = -Math.PI/2; plane.position.y = y-.02;
  scene.add(plane);
  return grid;
}


const ATTACKS = [
  { id:'conductivity', text:'Ataque de Alta Conductividad', correct:'material', color:0xf2b705,
    why:'Un material aislante corta la sobrecarga eléctrica.' },
  { id:'unstable-bond', text:'Ataque de Enlace Inestable', correct:'molecular', color:0x4ce0d2,
    why:'El escudo molecular contiene la reacción descontrolada.' },
  { id:'logic-fault', text:'Ataque de Falla Lógica', correct:'ley', color:0xb78cff,
    why:'La ley correcta corrige el error del sistema.' }
];
const ARTIFACTS = [
  { key:'material', name:'Material aislante', sub:'Núcleo de Densidad', color:0xd8922f },
  { key:'molecular', name:'Escudo molecular', sub:'Catalizador Molecular', color:0x4ce0d2 },
  { key:'ley', name:'Ley o fórmula', sub:'Matriz de Secuencia', color:0xb78cff }
];
const NEUTRALIZE = 6;

function buildBoss(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x100404);
  scene.fog = new THREE.FogExp2(0x100404, .03);

  scene.add(new THREE.AmbientLight(0x4a1c1c, 1.0));
  const key = new THREE.PointLight(0xff6b6b, 2.2, 60); key.position.set(0,6,4); scene.add(key);
  const back = new THREE.PointLight(0xf2b705, 1.1, 50); back.position.set(-8,3,-12); scene.add(back);
  const cool = new THREE.PointLight(0x4ce0d2, .9, 40); cool.position.set(6,-1,6); scene.add(cool);

  gridFloor(scene, -3.2, 0x5c1e1e, 0x1a0808);
  starField(scene, 260, 80, 0xffb3b3);

  // ---- reactor
  const boss = new THREE.Group(); boss.position.set(0, 2.4, -7.5); scene.add(boss);
  const coreMat = new THREE.MeshStandardMaterial({ color:0x2a0808, emissive:0xff3b3b, emissiveIntensity:1.0, roughness:.35, metalness:.45, flatShading:true });
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(2.3, 1), coreMat);
  boss.add(core);
  const coreGlow = glowSprite(0xff4d4d, 11, .38); boss.add(coreGlow);
  const cage = [];
  for(let i=0;i<2;i++){
    const hex = new THREE.Mesh(
      new THREE.TorusGeometry(3.5+i*.5, .08, 4, 6),
      new THREE.MeshStandardMaterial({ color:0x3a1010, emissive:0x8c2020, emissiveIntensity:.5, roughness:.4, metalness:.7 })
    );
    hex.rotation.x = i ? .5 : -.2; hex.rotation.y = i*.7;
    boss.add(hex); cage.push(hex);
  }
  // ojo
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(.95, 24, 18),
    new THREE.MeshStandardMaterial({ color:0x0a0303, roughness:.2, metalness:.1 })
  );
  eye.position.set(0,.1,2.05); eye.scale.set(1.35,.95,.45); boss.add(eye);
  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(.34, 20, 16),
    new THREE.MeshStandardMaterial({ color:0xff4d6d, emissive:0xff4d6d, emissiveIntensity:1.4, roughness:.3 })
  );
  pupil.position.set(0,.1,2.45); boss.add(pupil);
  boss.add(glowSprite(0xff4d6d, 2.6, .5).translateZ(2.5).translateY(.1));

  // ---- jugador
  const player = new THREE.Group(); player.position.set(0,-1.0,3.6); scene.add(player);
  const hull = new THREE.Mesh(
    new THREE.ConeGeometry(.55, 1.5, 6),
    new THREE.MeshStandardMaterial({ color:0x2a3f6f, emissive:0x3a5fa8, emissiveIntensity:.35, roughness:.4, metalness:.6, flatShading:true })
  );
  hull.rotation.x = -Math.PI/2; player.add(hull);
  const thruster = glowSprite(0x4ce0d2, 2.2, .5); thruster.position.z = .9; player.add(thruster);
  const shield = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 24, 16, 0, Math.PI*2, 0, Math.PI*.55),
    new THREE.MeshBasicMaterial({ color:0x4ce0d2, transparent:true, opacity:0, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  shield.rotation.x = -Math.PI/2; player.add(shield);

  // ---- artefactos flotantes
  const relics = [];
  ARTIFACTS.forEach((art,i)=>{
    const g = new THREE.Group();
    g.position.set((i-1)*3.1, .35, 1.0);
    let mesh;
    if(art.key === 'material'){
      mesh = new THREE.Mesh(new THREE.BoxGeometry(1.05,.8,.8),
        new THREE.MeshStandardMaterial({ color:0x6b4a18, emissive:art.color, emissiveIntensity:.35, roughness:.7, metalness:.3 }));
    } else if(art.key === 'molecular'){
      mesh = new THREE.Mesh(new THREE.SphereGeometry(.5, 24, 18),
        new THREE.MeshStandardMaterial({ color:0x0d3b3a, emissive:art.color, emissiveIntensity:.7, roughness:.25, metalness:.3 }));
      for(let k=0;k<3;k++){ const r = neonRing(.85,.022,art.color,.75); r.rotation.x = 1.1; r.rotation.y = k*Math.PI/3; mesh.add(r); }
    } else {
      mesh = new THREE.Mesh(new THREE.OctahedronGeometry(.68,0),
        new THREE.MeshStandardMaterial({ color:0x2a1b4d, emissive:art.color, emissiveIntensity:.7, roughness:.3, metalness:.5, flatShading:true }));
    }
    mesh.userData.key = art.key;
    g.add(mesh);
    g.add(glowSprite(art.color, 3.4, .35));
    scene.add(g);
    relics.push({ g, mesh, art, phase:i*1.9 });
  });

  const burst = makeBurst(scene, 0xff6b6b, 200);

  // ---- estado
  const bonus = 0;
  const maxHits = 4 + bonus;
  let hits = 0, neutralized = 0, attack = null, busy = false, over = false, rounds = 0;

  function instabilityPct(){ return 1 - neutralized/NEUTRALIZE; }

  function paintCore(){
    const t = neutralized/NEUTRALIZE;
    const hue = lerp(0, 210, t)/360;
    coreMat.emissive.setHSL(hue, .85, .55);
    coreMat.color.setHSL(hue, .6, .12);
    coreGlow.material.color.setHSL(hue, .8, .6);
    ui.hudBarFill.style.transform = 'scaleX('+instabilityPct()+')';
    ui.hudBar.classList.toggle('low', instabilityPct() < .34);
    setPips(neutralized, NEUTRALIZE);
  }
  function paintEnergy(){
    const f = 1 - hits/maxHits;
    ui.hudBar2Fill.style.transform = 'scaleX('+Math.max(0,f)+')';
    ui.hudBar2.classList.toggle('low', f <= .4);
  }

  function renderChoices(){
    ui.options.hidden = false;
    ui.options.innerHTML = '';
    ARTIFACTS.forEach(a=>{
      const b = document.createElement('button');
      b.className = 'option'; b.type = 'button';
      b.innerHTML = a.name + '<br><span style="color:var(--muted);font-size:16px">' + a.sub + '</span>';
      b.dataset.key = a.key;
      b.addEventListener('click', ()=> resolve(a.key));
      ui.options.appendChild(b);
    });
  }

  let introShown = false;
  function nextAttack(){
    if(over) return;
    let next;
    do { next = ATTACKS[Math.floor(Math.random()*ATTACKS.length)]; }
    while(attack && next.id === attack.id);
    attack = next;
    pupil.material.color.setHex(attack.color);
    pupil.material.emissive.setHex(attack.color);
    const intro = introShown ? '' :
      (bonus ? `Entras con ${bonus} artefacto(s): aguantas ${maxHits} impactos. ` : `Sin artefactos previos: aguantas ${maxHits} impactos. `);
    introShown = true;
    say(`${intro}El reactor carga: <b>${attack.text}</b>`);
    renderChoices();
    busy = false;
  }

  function projectileFor(a){
    const g = new THREE.Group();
    let m;
    if(a.id === 'conductivity'){
      m = new THREE.Mesh(new THREE.TetrahedronGeometry(.55,0),
        new THREE.MeshStandardMaterial({ color:a.color, emissive:a.color, emissiveIntensity:1.2, flatShading:true }));
    } else if(a.id === 'unstable-bond'){
      m = new THREE.Mesh(new THREE.SphereGeometry(.45,18,14),
        new THREE.MeshStandardMaterial({ color:a.color, emissive:a.color, emissiveIntensity:1.1, roughness:.3 }));
      [-.7,.7].forEach(x=>{
        const s = new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),
          new THREE.MeshStandardMaterial({ color:a.color, emissive:a.color, emissiveIntensity:.9 }));
        s.position.x = x; m.add(s);
      });
    } else {
      m = new THREE.Mesh(new THREE.BoxGeometry(.75,.75,.75),
        new THREE.MeshStandardMaterial({ color:0x1a0f33, emissive:a.color, emissiveIntensity:1.0, wireframe:true }));
    }
    g.add(m);
    g.add(glowSprite(a.color, 3, .45));
    g.userData.spin = m;
    return g;
  }

  function resolve(key){
    if(busy || over) return;
    busy = true;
    rounds++; bossRounds = rounds;
    ui.options.querySelectorAll('.option').forEach(o=>{
      o.disabled = true;
      if(o.dataset.key === key) o.classList.add(key === attack.correct ? 'correct' : 'wrong');
    });
    const relic = relics.find(r=> r.art.key === key);
    if(relic) tween({ dur:.3, ease:easeOut, step(p){ relic.g.scale.setScalar(lerp(1.3,1,p)); } });

    const shot = projectileFor(attack);
    const from = boss.position.clone(); from.z += 2.4;
    const to = player.position.clone(); to.y += .4;
    shot.position.copy(from);
    scene.add(shot);
    const good = key === attack.correct;

    tween({
      dur:.7, ease:t=>t*t,
      step(p){
        shot.position.lerpVectors(from, to, p);
        shot.userData.spin.rotation.x += .18; shot.userData.spin.rotation.y += .22;
      },
      done(){ good ? deflect(shot, to) : impact(shot); }
    });
  }

  function deflect(shot, at){
    neutralized++;
    paintCore();
    say(`<b>Ataque neutralizado.</b> ${attack.why}`);
    flash('#59e6a3', .3);
    fireBurst(burst, at, 3);
    tween({ dur:.45, ease:easeOut, step(p){ shield.material.opacity = Math.sin(p*Math.PI)*.55; shield.scale.setScalar(lerp(.8,1.15,p)); } });
    // el proyectil rebota hacia el reactor
    const from = shot.position.clone();
    const back = boss.position.clone();
    tween({
      dur:.55, ease:easeOut,
      step(p){ shot.position.lerpVectors(from, back, p); shot.scale.setScalar(lerp(1,.4,p)); },
      done(){
        scene.remove(shot);
        fireBurst(burst, boss.position, 5);
        rig.shake = .35;
        tween({ dur:.4, ease:easeOut, step(p){ boss.position.z = -7.5 - Math.sin(p*Math.PI)*.7; core.rotation.z += .05; } });
        if(neutralized >= NEUTRALIZE){ over = true; return victory(); }
        later(nextAttack, 650);
      }
    });
  }

  function impact(shot){
    hits++;
    paintEnergy();
    say(`<b>Defensa fallida.</b> ${attack.why}`, true);
    flash('#ff4d6d', .5);
    rig.shake = .75;
    fireBurst(burst, shot.position, 3.5);
    scene.remove(shot);
    const base = player.position.clone();
    tween({ dur:.45, ease:easeOut, step(p){ player.position.z = base.z + Math.sin(p*Math.PI)*.9; player.rotation.z = Math.sin(p*18)*.18*(1-p); },
      done(){ player.position.copy(base); player.rotation.z = 0; } });
    if(hits >= maxHits){ over = true; return later(()=> collapse(), 700); }
    later(nextAttack, 750);
  }

  function victory(){
    ui.options.hidden = true; ui.options.innerHTML = '';
    say('<b>Paradoja resuelta.</b> El reactor entra en estado frío.');
    tween({
      dur:2.0, ease:easeInOut,
      step(p){
        core.scale.setScalar(lerp(1, .15, p));
        coreGlow.material.opacity = lerp(.38, .9, Math.sin(p*Math.PI));
        cage.forEach((h,i)=>{ h.rotation.z += .02*(i+1); h.scale.setScalar(lerp(1,1.6,p)); h.material.emissiveIntensity = lerp(.5,0,p); });
      },
      done(){
        flash('#ffffff', .95);
        fireBurst(burst, boss.position, 7);
        later(()=> endLevel('l4', true), 700);
      }
    });
  }

  function collapse(){
    ui.options.hidden = true;
    flash('#ff4d6d', .8);
    tween({
      dur:1.1, ease:t=>t*t,
      step(p){ player.position.y = -1.0 - p*9; player.rotation.x += .09; },
      done(){ endLevel('l4', false, 'Tu energía llegó a cero antes de estabilizar el reactor.'); }
    });
  }

  // ---- montaje
  setAccent('#ff4d6d');
  ui.hudTag.textContent = 'JEFE FINAL';
  ui.hudTitle.textContent = 'Reactor inestable';
  ui.hudMetricLbl.textContent = 'Inestabilidad';
  ui.hudMetricWrap.hidden = false;
  ui.hudMetric2Wrap.hidden = false;
  ui.hudMetric2Lbl.textContent = 'Energía';
  ui.hudLivesLbl.textContent = 'Neutralizados';
  ui.consoleRow.innerHTML = '';
  paintCore(); paintEnergy();

  frameCamera({ tx:0, ty:.8, tz:-1.2, radius:11, theta:0, phi:1.25, thetaRange:.5, snap:true });
  nextAttack();

  let t = 0;
  return {
    scene,
    update(dt){
      t += dt;
      const inst = instabilityPct();
      core.rotation.y += dt*(.25 + inst*.5);
      core.rotation.x += dt*.12;
      boss.position.y = 2.4 + Math.sin(t*1.1)*.18;
      boss.position.z = lerp(boss.position.z, -7.5, 1-Math.pow(.01,dt));
      core.scale.setScalar(over ? core.scale.x : 1 + Math.sin(t*2.6)*.03*(.4+inst));
      cage.forEach((h,i)=>{ h.rotation.z += dt*(.3+i*.25)*(0.5+inst); });
      pupil.position.x = Math.sin(t*.9)*.35;
      eye.position.x = pupil.position.x*.35;
      player.position.x = Math.sin(t*.7)*.4;
      thruster.material.opacity = .4 + Math.sin(t*9)*.12;
      relics.forEach((r,i)=>{
        r.g.position.y = .35 + Math.sin(t*1.4 + r.phase)*.16;
        r.mesh.rotation.y += dt*.9; r.mesh.rotation.x += dt*.3;
      });
      updateBurst(burst, dt);
    },
    hitTargets(){ return (busy||over) ? [] : relics.map(r=> r.mesh); },
    click(ray){
      if(busy || over) return;
      const hit = ray.intersectObjects(relics.map(r=> r.mesh));
      if(hit.length) resolve(hit[0].object.userData.key);
    },
    dispose(){ ui.options.hidden = true; ui.options.innerHTML = ''; ui.hudMetric2Wrap.hidden = true; }
  };
}

function getScores(){ try{ return JSON.parse(localStorage.getItem('insam26_leaderboard') || '[]'); }catch(e){ return []; } }

let bossRounds = 0;
function endLevel(id, won, msg){
  if(won){
    const code = 'INSAM26-' + Math.random().toString(36).slice(2,6).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
    ui.resultCard.className = 'card win';
    ui.resultTitle.textContent = 'PARADOJA RESUELTA';

      `<strong>El reactor quedó en estado frío.</strong> Lo lograste en ${bossRounds} turnos. ` +
      'Muestra este código en el stand para validar tu partida.' +
      '<div id="qrHolder" class="qr-code"></div>' +
      `<div class="valid-code">${code}</div>` +
      '<div class="score-row"><input type="text" id="playerName" maxlength="20" placeholder="Tu nombre para el marcador"><button class="btn" id="saveScoreBtn">Guardar</button></div>' +
      '<div id="saveStatus" style="font-size:16px;color:var(--muted);min-height:20px;margin-bottom:6px"></div>' +
      `<div id="boardHolder">${boardHTML()}</div>`;

    try{ new QRCode(holder, { text:code, width:132, height:132, colorDark:'#100404', colorLight:'#ffffff' }); }
    catch(e){ holder.textContent = code; holder.style.color = '#100404'; }
    document.getElementById('saveScoreBtn').addEventListener('click', ()=>{
      const input = document.getElementById('playerName');
      const status = document.getElementById('saveStatus');
      const name = (input.value || 'Anónimo').slice(0,20);
      const list = getScores(); list.push({ name, rounds:bossRounds }); saveScores(list);
      document.getElementById('boardHolder').innerHTML = boardHTML();
      input.value = '';
      if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf('PEGA_AQUI') >= 0){
        status.textContent = 'Guardado solo en este dispositivo (sin hoja de cálculo configurada).';
        return;
      }
      status.textContent = 'Enviando a la hoja de cálculo…';
      fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        body: JSON.stringify({ name, rounds: bossRounds, code })
      })
        .then(r=> r.json())
        .then(r=>{ status.textContent = r && r.ok ? 'Guardado ✓' : 'La hoja rechazó el registro. Se guardó localmente.'; })
        .catch(()=>{ status.textContent = 'Sin conexión: se guardó localmente, reinténtalo si vuelve el internet.'; });
    });
  } else {
    ui.resultCard.className = 'card lose';
    ui.resultTitle.textContent = 'REACTOR EN COLAPSO';
    ui.resultText.innerHTML = (msg || 'Tu energía llegó a cero antes de estabilizar el reactor.') + ' Vuelve a intentarlo.';
  }
  ui.resultActions.innerHTML = '';
  const again = document.createElement('button');
  again.className = 'btn' + (won ? '' : ' primary');
  again.textContent = won ? 'Jugar de nuevo' : 'Reintentar';
  again.addEventListener('click', ()=> location.reload());
  ui.resultActions.appendChild(again);
  ui.result.classList.add('show');
}
